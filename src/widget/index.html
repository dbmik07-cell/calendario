<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'" />
    <title>Calendario</title>
    <link rel="stylesheet" href="widget.css" />
    <script type="module" src="widget.js"></script>
  </head>
  <body>
    <main class="widget">
      <header class="maniglia" id="titolo-mese"></header>
      <table class="mini-calendario">
        <thead>
          <tr><th>L</th><th>M</th><th>M</th><th>G</th><th>V</th><th>S</th><th>D</th></tr>
        </thead>
        <tbody id="giorni-mese"></tbody>
      </table>
      <form id="nuova-frase" class="nuova-frase" autocomplete="off">
        <input id="frase" type="text" spellcheck="false"placeholder="Es. domani alle 15 dentista" aria-label="Aggiungi con una frase" />
      </form>
      <p id="esito" class="esito" role="status" hidden></p>
      <section class="giornata">
        <h2 id="titolo-giorno"></h2>
        <ul id="impegni"></ul>
        <section id="sezione-cose-da-fare" hidden>
          <h3 class="sezione">Da fare</h3>
          <ul id="cose-da-fare"></ul>
        </section>
        <p id="giornata-vuota" class="vuota" hidden>Niente in programma</p>
      </section>
    </main>
  </body>
</html>
