<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'" />
    <title>Calendario</title>
    <link rel="stylesheet" href="widget.css" />
    <script type="module" src="widget.js"></script>
  </head>
  <body>
    <main class="widget">
      <p id="avviso-archivio" role="alert" hidden></p>
      <header class="maniglia">
        <h1 id="titolo-mese"></h1>
        <nav class="navigazione">
          <button type="button" id="mese-precedente" aria-label="Mese precedente">‹</button>
          <button type="button" id="torna-a-oggi">Oggi</button>
          <button type="button" id="mese-successivo" aria-label="Mese successivo">›</button>
        </nav>
      </header>
      <table class="mini-calendario">
        <thead>
          <tr><th>L</th><th>M</th><th>M</th><th>G</th><th>V</th><th>S</th><th>D</th></tr>
        </thead>
        <tbody id="giorni-mese"></tbody>
      </table>
      <form id="nuova-frase" class="nuova-frase" autocomplete="off">
        <input id="frase" type="text" spellcheck="false" placeholder="Es. domani alle 15 dentista" aria-label="Aggiungi con una frase" />
      </form>
      <p id="esito" class="esito" role="status" hidden></p>
      <section class="giornata">
        <h2 id="titolo-giorno"></h2>
        <ul id="impegni"></ul>
        <section id="sezione-cose-da-fare" hidden>
          <h3 class="sezione">Da fare</h3>
          <ul id="cose-da-fare"></ul>
        </section>
        <p id="giornata-vuota" class="vuota" hidden>Niente in programma</p>
      </section>
    </main>
    <dialog id="modifica-impegno" aria-labelledby="titolo-modifica">
      <form id="modulo-impegno">
        <h2 id="titolo-modifica">Modifica Impegno</h2>
        <label>Titolo<input id="modifica-titolo" required /></label>
        <label>Giorno<input id="modifica-giorno" type="date" required /></label>
        <label>Orario<input id="modifica-orario" type="time" required /></label>
        <label>Durata in minuti<input id="modifica-durata" type="number" min="1" step="1" placeholder="Senza durata" /></label>
        <label>Anticipo in minuti<input id="modifica-anticipo" type="number" min="0" step="1" required /></label>
        <label class="nessun-promemoria"><input id="modifica-senza-promemoria" type="checkbox" />Nessun Promemoria</label>
        <p id="errore-modifica" role="alert" hidden></p>
        <div class="azioni-modifica">
          <button type="submit">Salva</button>
          <button type="button" id="annulla-modifica">Annulla</button>
          <button type="button" id="cancella-impegno">Cancella</button>
        </div>
        <section id="conferma-cancellazione" aria-label="Conferma cancellazione" hidden>
          <p>Cancellare questo Impegno? L'operazione è definitiva.</p>
          <button type="button" id="conferma-cancella">Sì, cancella</button>
          <button type="button" id="mantieni-impegno">No, mantieni</button>
        </section>
      </form>
    </dialog>
  </body>
</html>
